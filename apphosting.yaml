# Firebase App Hosting configuration.
#
# App Hosting builds with `npm run build` and serves with `npm start`
# (server.js), so the Express API and the static bundle are served by the same
# service. Without this file no environment is passed to the container, which
# is why /api/enquiry returned 500 "Unable to send enquiry right now."
#
# Secret values are NOT stored here. A rollout FAILS if this file references a
# secret that does not exist yet, so the secret entries are added by the CLI at
# the moment the secret is created:
#
#   firebase apphosting:secrets:set SMTP_USER            --force
#   firebase apphosting:secrets:set SMTP_PASS            --force
#   firebase apphosting:secrets:set ENGAGEMENT_ADMIN_TOKEN --force
#   firebase apphosting:secrets:set ENGAGEMENT_IP_SALT   --force
#
# --force creates the secret, grants the backend service account access, and
# appends the matching `env` entry below. Commit the result and push to roll out.
#
# Until SMTP_USER/SMTP_PASS exist, /api/enquiry answers 503 and logs exactly
# which key is missing. Until ENGAGEMENT_ADMIN_TOKEN exists, the analytics
# dashboard stays closed (401) — which is the safe default, so never give it a
# guessable value.

runConfig:
  # A small hotel site: keep one warm instance so the first guest of the day
  # does not wait on a cold start, and cap spend.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Mail delivery (non-sensitive settings) ---
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME

  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME

  - variable: SMTP_SECURE
    value: "true"
    availability:
      - RUNTIME

  - variable: ENQUIRY_TO_EMAIL
    value: gmroyalfort@gmail.com
    availability:
      - RUNTIME

  - variable: RESEND_FROM
    value: "Hotel Royal Fort <enquiries@hotelroyalfort.in>"
    availability:
      - RUNTIME

  # --- Secrets appended for App Hosting ---
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # Meta WhatsApp Cloud API (1,000 free conversations/month)
  # Set these via Firebase Secret Manager when ready:
  #   firebase apphosting:secrets:set WHATSAPP_PHONE_NUMBER_ID  --force
  #   firebase apphosting:secrets:set WHATSAPP_ACCESS_TOKEN     --force
  #   firebase apphosting:secrets:set WHATSAPP_RECIPIENT_PHONE   --force
