# Firebase App Hosting configuration.
#
# App Hosting builds with `npm run build` and serves with `npm start`
# (server.js), so the Express API and the static bundle are served by the same
# service. Without this file no environment reaches the container.
#
# Secret values are NOT stored here. A rollout FAILS if this file references a
# secret that does not exist yet, so create each secret with the CLI, which also
# appends its `env` entry below:
#
#   firebase apphosting:secrets:set RESEND_API_KEY        --force
#   firebase apphosting:secrets:set ENGAGEMENT_ADMIN_TOKEN --force
#   firebase apphosting:secrets:set ENGAGEMENT_IP_SALT     --force
#
# --force creates the secret, grants the backend service account access, and
# appends the matching `env` entry. Commit the result and push to roll out.
#
# Until RESEND_API_KEY exists, /api/enquiry answers 503 and the front end offers
# a WhatsApp click-to-chat fallback. Until ENGAGEMENT_ADMIN_TOKEN exists, the
# analytics dashboard stays closed (401) — the safe default, so never give it a
# guessable value.

runConfig:
  # A small hotel site: cap spend, scale to zero when idle.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Mail delivery (non-sensitive settings) ---
  - variable: ENQUIRY_TO_EMAIL
    value: gmroyalfort@gmail.com
    availability:
      - RUNTIME

  - variable: RESEND_FROM
    value: "Hotel Royal Fort <enquiries@hotelroyalfort.in>"
    availability:
      - RUNTIME

  # --- Secrets appended for App Hosting ---
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  - variable: ENGAGEMENT_ADMIN_TOKEN
    secret: ENGAGEMENT_ADMIN_TOKEN
    availability:
      - RUNTIME

  - variable: ENGAGEMENT_IP_SALT
    secret: ENGAGEMENT_IP_SALT
    availability:
      - RUNTIME
