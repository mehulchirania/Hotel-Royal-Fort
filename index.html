<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Royal Fort Ballari | Comfortable Hotel Stay in Bellary</title>
    <meta name="description" content="Hotel Royal Fort in Ballari offers clean rooms, warm hospitality, convenient location access, and comfortable stays for families, business travellers, and visitors to Bellary." />
    <meta name="theme-color" content="#550a0a" />

    <!-- Link previews (WhatsApp, Facebook, X) — guests share hotel links constantly. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hotel Royal Fort" />
    <meta property="og:title" content="Hotel Royal Fort Ballari | Comfortable Hotel Stay in Bellary" />
    <meta property="og:description" content="AC rooms and suites, restaurant and lounge, banquet halls, and free parking on New Trunk Road, Ballari." />
    <meta property="og:image" content="/images/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applies the saved theme before first paint so a dark-mode reload
         does not flash a white page. Must stay inline and blocking. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rf_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data Placeholder -->
    <script type="application/ld+json">
    {

      ],
      "sameAs": [
        "https://www.facebook.com/placeholder",
        "https://www.instagram.com/placeholder"
      ]
    }
    </script>
  </head>

</html>
