<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Royal Fort Ballari | Comfortable Hotel Stay in Bellary</title>
    <meta name="description" content="Hotel Royal Fort in Ballari offers clean rooms, warm hospitality, convenient location access, and comfortable stays for families, business travellers, and visitors to Bellary." />
    <meta name="theme-color" content="#550a0a" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://hotelroyalfort.in/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />


    <!-- Link previews (WhatsApp, Facebook, X) — guests share hotel links
         constantly. These URLs MUST be absolute; scrapers do not resolve
         relative paths, so a "/images/..." og:image silently yields no preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hotel Royal Fort" />
    <meta property="og:url" content="https://hotelroyalfort.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Hotel Royal Fort Ballari | Comfortable Hotel Stay in Bellary" />
    <meta property="og:description" content="AC rooms and suites, restaurant and lounge, banquet halls, and free parking on New Trunk Road, Ballari." />
    <meta property="og:image" content="https://hotelroyalfort.in/images/social-card.jpg" />
    <meta property="og:image:secure_url" content="https://hotelroyalfort.in/images/social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hotel Royal Fort exterior, Ballari" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotel Royal Fort Ballari | Comfortable Hotel Stay in Bellary" />
    <meta name="twitter:description" content="AC rooms and suites, restaurant and lounge, banquet halls, and free parking on New Trunk Road, Ballari." />
    <meta name="twitter:image" content="https://hotelroyalfort.in/images/social-card.jpg" />

    <!-- Applies the saved theme before first paint so a returning dark-mode
         visitor does not flash light. Light is the default; dark only when the
         visitor previously toggled to it. Must stay inline and blocking, and
         must match the default in src/context/theme.tsx. -->
    <script src="/theme-init.js"></script>

    <!-- Local-business structured data. Values mirror src/data/hotel.ts — keep
         the two in step, since Google may surface this phone number and address
         directly in search results. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "@id": "https://hotelroyalfort.in/#hotel",
      "name": "Hotel Royal Fort",
      "logo": "https://hotelroyalfort.in/favicon.svg",
      "areaServed": { "@type": "City", "name": "Ballari" },
      "description": "Hotel Royal Fort in Ballari offers AC rooms and suites, restaurant and lounge facilities, banquet halls, and free on-site parking for families, business travellers, and visitors to Bellary.",
      "url": "https://hotelroyalfort.in/",
      "hasMap": "https://maps.app.goo.gl/YRUVNyEMvqwwzY7WA",
      "sameAs": ["https://maps.app.goo.gl/YRUVNyEMvqwwzY7WA"],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "New Trunk Road, Infantry Road, Housing Board Colony, Sanjay Gandhi Nagar",
        "addressLocality": "Ballari",
        "addressRegion": "Karnataka",
        "postalCode": "583104",
        "addressCountry": "IN"
      },
      "telephone": "+91-72597-58888",
      "email": "gmroyalfort@gmail.com",
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "15.148273",
        "longitude": "76.904129"
      },
      "hasMap": "https://www.google.com/maps/place/Royal+Fort/@15.147814,76.9012402,16z",
      "image": [
        "https://hotelroyalfort.in/images/social-card.jpg"
      ],
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Air conditioning", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Free parking", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Restaurant", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Room service", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Banquet hall", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Business centre", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Wheelchair accessible", "value": true }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://hotelroyalfort.in/#website",
      "url": "https://hotelroyalfort.in/",
      "name": "Hotel Royal Fort",
      "inLanguage": "en-IN",
      "publisher": { "@id": "https://hotelroyalfort.in/#hotel" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
